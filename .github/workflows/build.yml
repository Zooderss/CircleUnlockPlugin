name: Build PS Vita Plugin

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build CircleUnlock Plugin
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake

      - name: Compile Plugin
        run: |
          cd build
          make

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: circle_unlock.suprx
          path: build/circle_unlock.suprx
